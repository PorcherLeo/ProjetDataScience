name: fetch-velib

on:
  # collecte arrêtée le 7 novembre 2026 : plus de déclenchement automatique
  workflow_dispatch:         # lancement manuel possible

permissions:
  contents: write            # pour modifier la release

# un seul job à la fois : le suivant attend la fin du précédent
concurrency:
  group: fetch-velib
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt requests
      - name: Collecte toutes les 5 min
        working-directory: collecte
        run: ./ci_collect.sh
